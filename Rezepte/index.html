<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Rezepte sind umgezogen</title>
  <link rel="canonical" href="https://rezepte.timokempny.workers.dev/">
  <style>
    :root { --flaeche: #FBF8F6; --text: #2b2b2b; --haupt: #FEE0CE; --link: #9a4a1f; }
    @media (prefers-color-scheme: dark) { :root { --flaeche: #2a2a2a; --text: #eee; --haupt: #404040; --link: #B9CD8A; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--flaeche);
           color: var(--text); font: 1.05rem/1.5 system-ui, sans-serif; padding: 1rem; box-sizing: border-box; }
    main { max-width: 28rem; text-align: center; }
    .teller { width: 4.5rem; height: 4.5rem; margin: 0 auto 1rem; border-radius: 50%;
              border: .6rem solid var(--haupt); box-sizing: border-box; }
    a { color: var(--link); font-weight: 600; }
    small { opacity: .75; }
  </style>
</head>
<body>
  <main>
    <div class="teller" aria-hidden="true"></div>
    <h1>Die Rezepte sind umgezogen</h1>
    <p>Du wirst gleich weitergeleitet zu<br><a id="ziel" href="https://rezepte.timokempny.workers.dev/">rezepte.timokempny.workers.dev</a></p>
    <p><small>Bitte Lesezeichen anpassen. Die installierte App vom Startbildschirm löschen und von der neuen Adresse neu installieren.</small></p>
  </main>
  <script src="/Rezepte/umzug.js"></script>
</body>
</html>
